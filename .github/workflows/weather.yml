name: Weather Briefing

on:
  schedule:
    - cron: "0 1 * * *"      # 01:00 UTC = 08:00 giờ Việt Nam (GitHub dùng UTC, có thể trễ vài phút)
  workflow_dispatch: {}       # bấm chạy tay để thử / áp dụng địa điểm mới ngay

permissions:
  contents: write             # chỉ để commit location.json

concurrency:
  group: weather-briefing
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Gửi bản tin
        run: python main.py
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOCATION: ${{ vars.LOCATION || 'Hanoi' }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          LANGUAGE: ${{ vars.LANGUAGE }}

      - name: Commit location.json nếu có thay đổi
        if: always()
        run: |
          if [ -n "$(git status --porcelain location.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add location.json
            git commit -m "chore: update location"
            git push
          fi
